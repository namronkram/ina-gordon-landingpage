:root{

  --rose-deep:#C96F5C;  /* dunkleres Rosen für Hover */
  --gold:#D9A82A;       /* Gold (Dekor, Halbkreis) */
  --sage:#6F8B72;       /* Salbeigrün (Labels) */
  --line:#E4DACB;       /* dünne Trennlinien */

}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

}

      if(h==="mail") el.href="mailto:"+(K.kontakt&&K.kontakt.email||v);
      else if(h==="tel") el.href="tel:"+((K.kontakt&&K.kontakt.telefon||v).replace(/[^+0-9]/g,""));
      else if(h==="web") el.href="https://"+(K.kontakt&&K.kontakt.web||v);
    }
    el.innerHTML=val(el);
  });
  // Alt-Texte
  document.querySelectorAll("[data-k-alt]").forEach(function(el){
    el.setAttribute("alt", K[el.getAttribute("data-k-alt")]||"");
  });
  // Listen
  function abschluss(c){ return '<div class="c"><i>'+c.num+'</i><div><b>'+c.titel+'</b><span>'+c.text+'</span></div></div>'; }
  function angebot(a,i){ return '<a class="offer reveal" href="#kontakt"><span class="o-num">'+("0"+(i+1))+'</span><span class="o-t">'+a.titel+'</span><span class="o-d">'+a.text+'</span></a>'; }
  function fokus(f){ return '<div class="f reveal"><span class="k">'+f.kategorie+'</span><h3>'+f.titel+'</h3><p>'+f.text+'</p></div>'; }
  var eAbs=document.querySelector('[data-k="abschluesse"]');
  if(eAbs) eAbs.innerHTML=K.abschluesse.map(abschluss).join("");
  var eAnb=document.querySelector('[data-k="angebote"]');
  if(eAnb) eAnb.innerHTML=K.angebote.map(angebot).join("");
  var eFok=document.querySelector('[data-k="fokus"]');
  if(eFok) eFok.innerHTML=K.fokus.map(fokus).join("");
  var eMet=document.querySelector('[data-k="methoden"]');
  if(eMet){ eMet.innerHTML=K.methoden.map(function(m,i){ return (i?'<span class="dot"> · </span>':'')+(i===K.methoden.length-1?'<span class="hl">'+m+'</span>':m); }).join(""); }

  // scroll reveal
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); },{threshold:.12});
  document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
})();
</script>
</body>
</html>
